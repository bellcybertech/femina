<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>FEMINA 2026 Card Generator</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family: 'Segoe UI', sans-serif;
}

body{
  background:linear-gradient(135deg,#007853,#c40d3c);
  color:#333;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  background:#fff;
  padding:25px;
  border-radius:20px;
  width:95%;
  max-width:500px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  text-align:center;
}

h2{
  margin-bottom:15px;
  color:#c40d3c;
}

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ddd;
  outline:none;
}

input:focus{
  border-color:#c40d3c;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

.primary{
  background:#c40d3c;
  color:#fff;
}

.primary:hover{
  background:#a50b32;
}

.secondary{
  background:#007853;
  color:#fff;
}

.secondary:hover{
  background:#005c40;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

canvas{
  margin-top:20px;
  width:100%;
  border-radius:15px;
  border:1px solid #ddd;
}
</style>

</head>
<body>

<div class="container">

<h2>🎉 FEMINA 2026 Card</h2>

<input type="text" id="name" placeholder="Votre nom">
<input type="text" id="role" placeholder="Votre fonction">
<input type="file" id="photo">

<button class="primary" onclick="generate()">✨ Générer ma carte</button>
<button class="secondary" onclick="downloadCard()">⬇ Télécharger</button>

<div class="actions">
  <button class="secondary" onclick="shareWhatsApp()">WhatsApp</button>
  <button class="secondary" onclick="share('facebook')">Facebook</button>
  <button class="secondary" onclick="share('twitter')">Twitter</button>
  <button class="secondary" onclick="share('telegram')">Telegram</button>
</div>

<canvas id="canvas" width="800" height="800"></canvas>

</div>

<script>
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let ready = false;

// 👉 TON LIEN VERCEL
const SHARE_URL = "https://femina-iota.vercel.app/";

function generate(){
  ready = false;

  let name = document.getElementById("name").value || "Your Name";
  let role = document.getElementById("role").value || "Your Role";
  let file = document.getElementById("photo").files[0];

  let img = new Image();

  function drawCard(){
    ctx.clearRect(0,0,800,800);

    let gradient = ctx.createLinearGradient(0,0,800,800);
    gradient.addColorStop(0,"#007853");
    gradient.addColorStop(1,"#c40d3c");
    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,800,800);

    ctx.fillStyle="rgba(255,255,255,0.9)";
    ctx.fillRect(50,50,700,700);

    ctx.fillStyle="#c40d3c";
    ctx.font="bold 50px Arial";
    ctx.textAlign="center";
    ctx.fillText("FEMINA 2026",400,130);

    ctx.fillStyle="#007853";
    ctx.font="18px Arial";
    ctx.fillText("1ère édition",400,170);

    ctx.font="16px Arial";
    ctx.fillText("FOIRE ECONOMIQUE DES MANUFACTURIERES",400,200);
    ctx.fillText("ET INNOVATRICES AFRICAINES",400,225);

    ctx.fillStyle="#000";
    ctx.font="18px Arial";
    ctx.fillText("📍 Garoua, Cameroun",400,260);
    ctx.fillText("📅 Du 13 au 18 avril au Stade Omnisport de Roumndé Adjia",400,290);

    if(file && img.complete){
      ctx.save();
      ctx.beginPath();
      ctx.arc(400,420,120,0,Math.PI*2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(img,280,300,240,240);
      ctx.restore();
    }else{
      ctx.beginPath();
      ctx.arc(400,420,120,0,Math.PI*2);
      ctx.stroke();
      ctx.fillText("Photo",400,420);
    }

    ctx.fillStyle="#000";
    ctx.font="bold 32px Arial";
    ctx.fillText(name,400,600);

    ctx.font="20px Arial";
    ctx.fillText(role,400,640);

    ctx.fillStyle="#c40d3c";
    ctx.font="bold 28px Arial";
    ctx.fillText("J'Y SERAI! ET TOI?",400,720);

    ready = true;
  }

  if(file){
    let reader = new FileReader();
    reader.onload = function(e){
      img.onload = drawCard;
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }else{
    drawCard();
  }
}

function downloadCard(){
  if(!ready){
    alert("Génère d'abord ta carte !");
    return;
  }

  let link = document.createElement('a');
  link.download = "femina_card.png";
  link.href = canvas.toDataURL();
  link.click();
}

// ===== PARTAGE =====

function shareWhatsApp(){
  let message = "🎉 Rejoins-moi à FEMINA 2026 !\n👉 " + SHARE_URL;
  let url = "https://wa.me/?text=" + encodeURIComponent(message);
  window.open(url, "_blank");
}

function share(platform){
  let text = "Rejoins FEMINA 2026 !";
  
  if(platform === "facebook"){
    window.open("https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(SHARE_URL));
  }

  if(platform === "twitter"){
    window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(text) + "&url=" + encodeURIComponent(SHARE_URL));
  }

  if(platform === "telegram"){
    window.open("https://t.me/share/url?url=" + encodeURIComponent(SHARE_URL) + "&text=" + encodeURIComponent(text));
  }
}
</script>

</body>
</html>
